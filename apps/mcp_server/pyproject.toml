[project]
name = "mcp-server"
version = "0.1.0"
description = "FastMCP HTTP adapter for rag_core"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=2.0.0",
    "rag-core",
]

[project.scripts]
mcp-server = "mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv.sources]
rag-core = { workspace = true }
